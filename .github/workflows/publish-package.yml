name: publish-package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setting up build version
        shell: bash
        run: |
          echo "BUILD_VERSION=4.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore Soenneker.Blazor.Masonry.slnx --verbosity minimal

      - name: Build
        run: dotnet build Soenneker.Blazor.Masonry.slnx --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Blazor.Masonry.Tests/Soenneker.Blazor.Masonry.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal


      - name: Restore library
        run: dotnet restore src/Soenneker.Blazor.Masonry/Soenneker.Blazor.Masonry.csproj --verbosity minimal

      - name: Build library
        run: dotnet build src/Soenneker.Blazor.Masonry/Soenneker.Blazor.Masonry.csproj --configuration Release --no-restore --verbosity minimal

      - name: Pack
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet pack src/Soenneker.Blazor.Masonry/Soenneker.Blazor.Masonry.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --output ./artifacts

      - name: Log in to NuGet
        uses: soenneker/nuget-resilient-login@v7
        id: nuget-login
        with:
          user: soenneker

      - name: Publish to NuGet
        uses: soenneker/nuget-resilient-publish@v4
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: 'artifacts/*.nupkg'

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/soenneker/index.json" \
            --api-key "${{ secrets.GH__TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN }}
        shell: bash
        run: |
          gh release create "v$BUILD_VERSION" \
            --title "v$BUILD_VERSION" \
            --notes "$PACKAGE_RELEASE_NOTES"
